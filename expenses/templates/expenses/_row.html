<li class="row">
  <span class="tile" aria-hidden="true">{{ t.get_category_display|first }}</span>
  <span class="row-text">
    <strong>{{ t.description }}</strong>
    <small>{{ t.get_category_display }} · {{ t.date|date:"M j" }}</small>
  </span>
  <span class="amount {{ t.kind }}">{% if t.kind == 'income' %}+{% else %}−{% endif %}₱{{ t.amount|floatformat:"2g" }}</span>
</li>
