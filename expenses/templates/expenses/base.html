{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f3f2e">
  <title>{% block title %}Extrackash{% endblock %}</title>
  <link rel="icon" href="{% static 'expenses/logo.png' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'expenses/style.css' %}">
</head>
<body>
  {% if messages %}
  <div class="toasts" role="status">
    {% for m in messages %}<p class="toast">{{ m }}</p>{% endfor %}
  </div>
  {% endif %}
  <main class="screen">
    {% block content %}{% endblock %}
  </main>
  {% block tabbar %}
  <nav class="tabbar" aria-label="Main">
    <a href="{% url 'home' %}" {% if tab == 'home' %}aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20H4z"/></svg>Home
    </a>
    <a href="{% url 'activity' %}" {% if tab == 'activity' %}aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 20V4M4 8l4-4 4 4M16 4v16M12 16l4 4 4-4"/></svg>Activity
    </a>
    <a href="{% url 'plan' %}" {% if tab == 'plan' %}aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4M9 14h6"/></svg>Plan
    </a>
    <a href="{% url 'explore' %}" {% if tab == 'explore' %}aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>Explore
    </a>
  </nav>
  {% endblock %}
  <script src="{% static 'expenses/app.js' %}"></script>
</body>
</html>
